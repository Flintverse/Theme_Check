<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Theme check</title>
<style>
:root{--bg:#f5f6f4;--surface:#fff;--ink:#1b2321;--muted:#5b6662;--line:#dfe3df;--accent:#1f6f5c;--accent-ink:#fff;--pass:#1c7a4a;--pass-bg:#e3f3e9;--fail:#b42318;--fail-bg:#fdeceb;--warn:#9a5b00;--warn-bg:#fdf2dc;--na:#4b5563;--na-bg:#eceef0}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#121615;--surface:#1a201e;--ink:#e6ebe8;--muted:#9aa6a1;--line:#2c3532;--accent:#5fc3a7;--accent-ink:#0b1210;--pass:#6fd39c;--pass-bg:#173326;--fail:#ff8a7e;--fail-bg:#3a1a17;--warn:#f2b860;--warn-bg:#3a2a10;--na:#b8c0c8;--na-bg:#262c31}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
.bar{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 20px}
.brand{font:600 18px Georgia,serif}
.badge{font:600 11px ui-monospace,monospace;letter-spacing:.06em;padding:3px 8px;border-radius:999px;background:var(--na-bg);color:var(--na)}
.badge.local{background:var(--pass-bg);color:var(--pass)}
nav{display:flex;flex-wrap:wrap;gap:4px;margin-left:auto}
nav a{padding:6px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
nav a.on{background:var(--accent);color:var(--accent-ink)}
nav a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main{max-width:1240px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:18px}
h2{font:600 20px system-ui;margin:0}
h3{font:600 13px ui-monospace,monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px 18px;min-width:0}
.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kpi b{display:block;font:600 28px system-ui;font-variant-numeric:tabular-nums}
.kpi span{font:12px ui-monospace,monospace;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.kpi small{display:block;color:var(--muted);font-size:12px}
.good b{color:var(--pass)}.bad b{color:var(--fail)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{font:600 12px ui-monospace,monospace;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);white-space:nowrap}
.scroll{overflow-x:auto}
.pill{font:600 11px ui-monospace,monospace;letter-spacing:.05em;padding:2px 8px;border-radius:999px;white-space:nowrap;display:inline-block}
.p-open,.p-fail,.p-critical{background:var(--fail-bg);color:var(--fail)}
.p-fixed,.p-pass{background:var(--pass-bg);color:var(--pass)}
.p-major{background:var(--warn-bg);color:var(--warn)}
.p-minor,.p-na,.p-review{background:var(--na-bg);color:var(--na)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
label.f{display:grid;gap:3px;font:600 12px ui-monospace,monospace;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=time],input[type=number],select,textarea{font:15px system-ui;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
textarea{width:100%;min-height:90px}
button{font:600 14px system-ui;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.danger{color:var(--fail)}
button[disabled]{opacity:.45;cursor:not-allowed}
.bars{display:grid;gap:6px}
.bar-row{display:grid;grid-template-columns:minmax(80px,170px) 1fr 34px;gap:8px;align-items:center;font-size:14px}
.bar-row .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .b{height:10px;background:var(--na-bg);border-radius:6px;overflow:hidden}
.bar-row .b i{display:block;height:100%;background:var(--fail)}
.bar-row .n{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted)}
.dots{display:inline-flex;gap:3px;vertical-align:middle}
.dots i{width:10px;height:10px;border-radius:50%;background:var(--na-bg);display:block}
.dots i.fail{background:var(--fail)}.dots i.pass{background:var(--pass)}
.muted{color:var(--muted)}.small{font-size:13px}
.note{background:var(--warn-bg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:14px}
.ok{background:var(--pass-bg);color:var(--pass);border-radius:8px;padding:8px 12px;font-size:14px}
pre{margin:0;white-space:pre-wrap;word-break:break-word;font:12px/1.45 ui-monospace,monospace;background:var(--na-bg);padding:10px;border-radius:8px;max-height:260px;overflow:auto}
a{color:var(--accent)}
.hide{display:none!important}
.ev{display:grid;gap:6px;min-width:190px;max-width:260px}.ev img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:var(--na-bg)}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:20;cursor:zoom-out;padding:16px}#lightbox img{max-width:100%;max-height:100%;border-radius:8px}
svg.chart{width:100%;height:150px}
.pulse{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--fail);animation:pulse 1.4s ease-in-out infinite;vertical-align:middle}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.pbar{height:14px;background:var(--na-bg);border-radius:8px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--accent);transition:width .6s}
.st-queued{background:var(--na-bg);color:var(--na)}.st-installing,.st-installed,.st-preparing,.st-setup{background:var(--warn-bg);color:var(--warn)}.st-testing{background:var(--accent);color:var(--accent-ink)}.st-done{background:var(--pass-bg);color:var(--pass)}.st-failed{background:var(--fail-bg);color:var(--fail)}
.linkbtn{background:none;border:0;padding:0;font:inherit;font-weight:600;color:var(--accent);cursor:pointer;text-align:left;text-decoration:underline}
#detail{position:fixed;left:0;right:0;bottom:0;top:var(--hh,100px);display:none;z-index:15;background:rgba(0,0,0,.45)}#detail.on{display:flex;justify-content:flex-end}
#detail .panel{background:var(--bg);width:min(1040px,100%);height:100%;overflow-y:auto;overflow-x:hidden;padding:16px 16px 48px;display:flex;flex-direction:column;gap:16px;box-shadow:-8px 0 24px rgba(0,0,0,.25);overscroll-behavior:contain}
#detail .panel>*{flex:0 0 auto;min-width:0}
#detail .dhead{position:sticky;top:-16px;z-index:2;background:var(--bg);padding:12px 0 8px;justify-content:space-between}
#detail .kpis{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.vgrid{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;min-width:150px}
.vb{display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;cursor:pointer}
.vb input{width:18px;height:18px;margin:0;cursor:pointer}
.lb-x{position:fixed;top:14px;right:14px;width:46px;height:46px;border-radius:999px;border:0;background:#fff;color:#111;font:700 26px/46px system-ui;cursor:pointer;z-index:2}
a.brand{color:inherit;text-decoration:none}
.navbtn{font:inherit;font-weight:600;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}.navbtn:disabled{opacity:.45;cursor:default}
.crumbs{max-width:1240px;margin:0 auto;padding:0 16px 8px;font-size:13px;color:var(--muted)}.crumbs a{color:var(--accent);text-decoration:none}.crumbs a:hover{text-decoration:underline}
#detail .dnav{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}#detail .dnav a{color:var(--accent);text-decoration:none;font-weight:600}
#detail .dbtns{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chk{width:100%;min-width:760px;border-collapse:collapse}.chk td,.chk th{vertical-align:top;padding:6px 8px;border-top:1px solid var(--line);text-align:left}.chk .ev{max-width:200px;min-width:120px}
.log{max-height:300px;overflow:auto;font:12px/1.5 ui-monospace,monospace}.log div{padding:2px 0;border-bottom:1px solid var(--line)}
@media (max-width:640px){.bar-row{grid-template-columns:90px 1fr 30px}}
</style>
</head>
<body>
<header><div class="bar">
  <button id="back" class="navbtn" title="Back to the previous page" disabled>&larr; Back</button>
  <a class="brand" href="#overview" title="Home (Overview)">Theme check</a><span id="mode" class="badge">...</span><span id="who" class="muted small"></span>
  <nav id="nav"></nav>
</div><div class="crumbs" id="crumbs" aria-label="You are here"></div></header>
<div id="detail" role="dialog" aria-modal="true" aria-label="Results of one theme"><div class="panel" id="detail-body"></div></div>
<div id="lightbox" role="dialog" aria-label="Picture"></div>
<main id="main"><div class="card">Loading...</div></main>

<script>
(function () {
  var CAN = false; // signed in on the web copy AND listed as an editor
  var S = null, P = null, TAB = 'overview', draftThemes = null, issueFilter = { status: 'open', theme: '', check: '', env: '' };
  var TABS = [['live', 'Live'], ['overview', 'Overview'], ['issues', 'Issue tracker'], ['runs', 'Runs'], ['themes', 'Themes'], ['schedule', 'Schedule']];

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function $(id) { return document.getElementById(id); }

  function api(method, path, body) {
    return fetch(path, { method: method, headers: { 'Content-Type': 'application/json', 'X-TC': '1' }, body: body ? JSON.stringify(body) : undefined })
      .then(function (r) { return r.json().then(function (j) { if (!r.ok) throw new Error(j.error || r.statusText); return j; }); });
  }

  function apiGet(path) { return fetch(path, { cache: 'no-store', credentials: 'same-origin' }); }
  function loadGoogle() {
    return new Promise(function (resolve, reject) {
      if (window.google && window.google.accounts && window.google.accounts.id) return resolve();
      var sc = document.createElement('script'); sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
      sc.onload = function () { resolve(); }; sc.onerror = function () { reject(new Error('Google sign-in could not be loaded')); };
      document.head.appendChild(sc);
    });
  }
  // The Cloudflare copy is for @bsscommerce.com people only: sign in with Google, the server checks the account.
  function askKey(msg) {
    $('main').innerHTML = '<div class="card" style="max-width:460px;margin:40px auto"><h2>Sign in</h2><p class="muted small" id="g-msg">' + esc(msg || 'Use your company Google account (@bsscommerce.com).') + '</p><div id="g-btn" style="min-height:44px"></div></div>';
    function fail(t) { var m = $('g-msg'); if (m) { m.textContent = t; m.style.color = 'var(--fail)'; } }
    fetch('/api/config', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (cfg) {
      if (!cfg.googleClientId) { fail('Sign-in is not configured yet.'); return; }
      return loadGoogle().then(function () {
        window.google.accounts.id.initialize({
          client_id: cfg.googleClientId, hd: cfg.domain, auto_select: false,
          callback: function (resp) {
            fetch('/api/login', { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ credential: resp.credential }) })
              .then(function (r) { return r.json().then(function (j) { if (r.ok) { location.reload(); } else { fail(j.error || 'Sign-in failed.'); } }); })
              .catch(function () { fail('Sign-in failed. Try again.'); });
          },
        });
        window.google.accounts.id.renderButton($('g-btn'), { theme: 'outline', size: 'large', text: 'signin_with', shape: 'rectangular' });
      });
    }).catch(function (e) { fail(e.message || 'Sign-in could not start.'); });
  }
  function isRO() { return !!S.readOnly && !CAN; }
  function showWho() {
    if (!S || !S.readOnly) return;
    fetch('/api/me', { credentials: 'same-origin', cache: 'no-store' }).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (u) {
      var w = $('who'); if (!w) return;
      if (!!u.canEdit !== CAN) { CAN = !!u.canEdit; render(); }
      w.innerHTML = esc(u.email) + ' &middot; <a href="#" id="signout">Sign out</a>';
      $('signout').onclick = function (e) { e.preventDefault(); fetch('/api/logout', { method: 'POST', credentials: 'same-origin' }).then(function () { location.reload(); }); };
    }).catch(function () { /* local dashboard: no sign-in */ });
  }
  function load() {
    return apiGet('/api/state').then(function (r) { if (r.status === 401) { askKey(); throw 'key'; } if (!r.ok) throw 0; return r.json(); })
      .catch(function (e) { if (e === 'key') throw e; return fetch('api/state.json', { cache: 'no-store' }).then(function (r) { return r.json(); }); })
      .then(function (s) { S = s; draftThemes = null; render(); showWho(); })
      .catch(function (e) { if (e === 'key') return; $('main').innerHTML = '<div class="card">Could not load data. Run <code>node src/cli.js ui</code> or open the published copy.</div>'; });
  }

  function nav() {
    $('nav').innerHTML = TABS.map(function (t) { return '<a href="#' + t[0] + '" class="' + (TAB === t[0] ? 'on' : '') + '">' + t[1] + (t[0] === 'live' && P && P.running ? ' <span class="pulse"></span>' : '') + '</a>'; }).join('');
    var m = $('mode');
    m.textContent = S.readOnly ? 'READ-ONLY COPY' + (S.publishedAt ? ' · ' + tsLocal(S.publishedAt).slice(0, 10) : '') : 'LOCAL · EDITABLE';
    m.className = 'badge' + (S.readOnly ? '' : ' local');
    crumbs();
  }

  function render() {
    if (!S) return;
    nav();
    var f = { live: vLive, overview: vOverview, issues: vIssues, runs: vRuns, themes: vThemes, schedule: vSchedule }[TAB] || vOverview;
    $('main').innerHTML = '<div id="banner">' + bannerHtml() + '</div><div id="view" style="display:grid;gap:18px">' + f() + '</div>';
    if (TAB === 'themes') bindThemes();
    if (TAB === 'schedule') bindSchedule();
    if (TAB === 'issues') bindIssues();
  }

  function kpi(label, val, sub, cls) { return '<div class="kpi ' + (cls || '') + '"><span>' + esc(label) + '</span><b>' + esc(val) + '</b>' + (sub ? '<small>' + esc(sub) + '</small>' : '') + '</div>'; }
  function delta(now, prev, lowerIsBetter) {
    if (prev == null) return '';
    var d = now - prev; if (d === 0) return 'same as previous run';
    return (d > 0 ? '+' : '') + d + ' vs previous run';
  }
  function bars(items, labelKey, valKey, max) {
    if (!items.length) return '<div class="muted small">Nothing to show.</div>';
    var m = max || Math.max.apply(null, items.map(function (i) { return i[valKey]; })) || 1;
    return '<div class="bars">' + items.map(function (i) {
      return '<div class="bar-row"><span class="t" title="' + esc(i.title || i[labelKey]) + '">' + esc(i[labelKey]) + '</span><span class="b"><i style="width:' + Math.round(i[valKey] / m * 100) + '%"></i></span><span class="n">' + i[valKey] + '</span></div>';
    }).join('') + '</div>';
  }

  function chart(runs) {
    var r = runs.slice(0, 14).reverse();
    if (r.length < 2) return '<div class="muted small">The trend appears after two runs.</div>';
    var W = 600, H = 140, pad = 24, mx = Math.max.apply(null, r.map(function (x) { return Math.max(x.failedChecks, x.themesWithIssues); })) || 1;
    function pt(v, i) { return (pad + i * (W - 2 * pad) / (r.length - 1)).toFixed(1) + ',' + (H - pad - v / mx * (H - 2 * pad)).toFixed(1); }
    var l1 = r.map(function (x, i) { return pt(x.failedChecks, i); }).join(' '), l2 = r.map(function (x, i) { return pt(x.themesWithIssues, i); }).join(' ');
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Failing checks and themes with issues per run"><polyline fill="none" stroke="var(--fail)" stroke-width="2" points="' + l1 + '"/><polyline fill="none" stroke="var(--accent)" stroke-width="2" stroke-dasharray="5 4" points="' + l2 + '"/>' +
      r.map(function (x, i) { var p = pt(x.failedChecks, i).split(','); return '<circle cx="' + p[0] + '" cy="' + p[1] + '" r="3" fill="var(--fail)"><title>' + esc(x.date + ': ' + x.failedChecks + ' failing checks, ' + x.themesWithIssues + ' themes') + '</title></circle>'; }).join('') +
      '</svg><div class="small muted"><span style="color:var(--fail)">&#9632;</span> failing checks &nbsp; <span style="color:var(--accent)">&#9632;</span> themes with issues &nbsp; (' + esc(r[0].date) + ' to ' + esc(r[r.length - 1].date) + ')</div>';
  }

  function vOverview() {
    var runs = S.runs.filter(function (r) { return r.env !== 'url'; });
    if (!runs.length) return '<div class="card"><h2>No runs yet</h2><p class="muted">Once a run finishes, its date, error counts and worst themes appear here. Start one from the Schedule tab.</p></div>';
    var L = runs[0], P = runs[1];
    var open = 0, fixed = 0; Object.keys(S.issues.items || {}).forEach(function (k) { var it = S.issues.items[k]; if (it.env === L.env) { if (it.status === 'open') open++; else fixed++; } });
    return '<div><h2>Latest run: ' + esc(L.date) + ' <span class="muted small">(' + esc(L.env) + ', ' + esc(L.runId) + ')</span></h2></div>' +
      '<div class="kpis">' +
      kpi('Themes tested', L.themesTested, L.themesTotal + ' in the list') +
      kpi('Themes with issues', L.themesWithIssues, delta(L.themesWithIssues, P && P.themesWithIssues), L.themesWithIssues ? 'bad' : 'good') +
      kpi('Failing checks', L.failedChecks, delta(L.failedChecks, P && P.failedChecks), L.failedChecks ? 'bad' : 'good') +
      kpi('New this run', L.newCount, 'not failing last time', L.newCount ? 'bad' : 'good') +
      kpi('Fixed this run', L.fixedCount, 'failing before, passing now', L.fixedCount ? 'good' : '') +
      kpi('Open issues (all time)', open, fixed + ' already fixed') + '</div>' +
      (L.setupFailures && L.setupFailures.length ? '<div class="note">' + L.setupFailures.length + ' theme(s) could not be set up and were not tested: ' + L.setupFailures.map(function (s) { return esc(s.theme) + ' (' + esc(s.reason) + ')'; }).join(', ') + '</div>' : '') +
      '<div class="grid"><div class="card"><h3>Themes with the most failing checks</h3>' + bars(L.worstThemes, 'theme', 'fails') + '</div>' +
      '<div class="card"><h3>Most common issues (themes affected)</h3>' + bars(L.topChecks.map(function (c) { return { label: c.id + ' ' + c.title.slice(0, 40), title: c.title, themes: c.themes }; }), 'label', 'themes') + '</div></div>' +
      '<div class="card"><h3>Trend</h3>' + chart(runs) + '</div>' +
      (L.fixed && L.fixed.length ? '<div class="card"><h3>Fixed since the previous run</h3><div class="small">' + L.fixed.map(function (f) { return '<span class="pill p-fixed">' + esc(f.theme) + ' ' + esc(f.id) + '</span> '; }).join('') + '</div></div>' : '') +
      '<div class="card"><h3>Full report</h3>' + reportLink(L.runId, 'report.html of ' + esc(L.runId)) + ' <span class="muted small">(a picture of every failing check)</span></div>';
  }

  // file = report.html (all themes) or report-<theme>.html (one theme)
  function themeReportFile(name) { return 'report-' + String(name).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') + '.html'; }
  function reportLink(runId, label, anchor, file) {
    if (S.mediaLocal !== false) return '<a href="runs/' + encodeURIComponent(runId) + '/' + (file || 'report.html') + (anchor ? '#' + encodeURIComponent(anchor) : '') + '">' + label + '</a>';
    if (S.evidenceUrl) return '<a href="' + esc(S.evidenceUrl) + '" target="_blank" rel="noopener">' + label + ' (Drive: runs/' + esc(runId) + ')</a>';
    return '<span class="muted small">' + label + ': on the test machine, history/runs/' + esc(runId) + '/report.html</span>';
  }
  function mediaUrl(run, rel) { return 'runs/' + encodeURIComponent(run) + '/' + String(rel).split('/').map(encodeURIComponent).join('/'); }
  function evidenceHtml(i) {
    var e = i.evidence; if (!e || !(e.shots && e.shots.length)) return '<span class="muted small">none kept</span>';
    if (S.mediaLocal === false) return '<div class="small">' + (S.evidenceUrl ? '<a href="' + esc(S.evidenceUrl) + '" target="_blank" rel="noopener">Open the evidence on Drive</a>' : 'On the test machine') + '<div class="muted">runs/' + esc(e.run) + '/' + esc((e.shots && e.shots[0]) || e.video) + (e.shots && e.shots.length > 1 ? ' (+' + (e.shots.length - 1) + ' more)' : '') + '</div></div>';
    return '<div class="ev">' + (e.shots || []).map(function (sh) { return '<img loading="lazy" data-zoom="1" src="' + esc(mediaUrl(e.run, sh)) + '" alt="' + esc(sh.split('/').pop()) + '">'; }).join('') +
      '</div>';
  }
  function dots(it) {
    var h = (it.history || []).slice(-12);
    return '<span class="dots">' + h.map(function (x) { return '<i class="' + (x.s === 'fail' ? 'fail' : x.s === 'pass' ? 'pass' : '') + '" title="' + esc(x.date + ': ' + x.s) + '"></i>'; }).join('') + '</span>';
  }

  function vIssues() {
    var items = Object.keys(S.issues.items || {}).map(function (k) { return S.issues.items[k]; });
    var themes = Array.from(new Set(items.map(function (i) { return i.theme; }))).sort();
