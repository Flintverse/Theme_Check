name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # the tests drive a real Google Chrome: make sure the runner has one
      - run: npx playwright-core install chrome
      - name: Run the tests (failing test names are printed as annotations)
        shell: bash
        run: |
          set +e
          npm test > test.log 2>&1
          code=$?
          tail -n 60 test.log
          grep -E -A14 "^not ok" test.log | grep -E "not ok|error:|message|code:|actual|expected|at |Error" | head -40 | while IFS= read -r line; do echo "::error::${line:0:220}"; done
          exit $code
