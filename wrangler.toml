name = "theme-check"
pages_build_output_dir = "site"
compatibility_date = "2024-11-01"

# One R2 bucket holds the dashboard data, the live progress and every run's reports and pictures.
# Create it first:  npx.cmd wrangler@3 r2 bucket create theme-check-data
[[r2_buckets]]
binding = "STORE"
bucket_name = "theme-check-data"
